{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg">

<div class="card-body p-4">

<h2 class="text-center text-primary mb-4">

🔒 Change Password

</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">

Current Password

</label>

<input
type="password"
name="old_password"
class="form-control"
placeholder="Enter Current Password"
required>

</div>

<div class="mb-3">

<label class="form-label">

New Password

</label>

<input
type="password"
name="new_password"
class="form-control"
placeholder="Enter New Password"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-primary">

Update Password

</button>

</div>

</form>

<div class="text-center mt-3">

<a href="/dashboard">

← Back to Dashboard

</a>

</div>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
